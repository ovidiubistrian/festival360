# Production stack for a VPS (Docker + Docker Compose).
# Images are pulled from GHCR (built & pushed by GitHub Actions).
# Values come from a .env file next to this compose (see .env.prod.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      CORS_ORIGINS: https://${DOMAIN},https://${API_DOMAIN}
      PLATFORM_DOMAIN: ${DOMAIN}
    expose:
      - "8000"

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Server-side SSR calls the API over the internal network (fast, no TLS).
      API_INTERNAL_URL: http://api:8000
      # Client-side calls use the public API domain (baked at build too).
      NEXT_PUBLIC_API_BASE_URL: https://${API_DOMAIN}
      # Platform apex — the middleware treats any other host as a tenant domain.
      NEXT_PUBLIC_PLATFORM_DOMAIN: ${DOMAIN}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
